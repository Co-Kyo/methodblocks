name: Release

# 推送 v* tag 即自动发版：版本门 → 注册表查重 → 构建 → 测试 → npm 发布（OIDC＋provenance）→ GitHub Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  id-token: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: ancestry 门——tag 必须在 main 上
        run: |
          git fetch origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main

      - name: 版本门——tag 与 package.json 一致
        run: |
          V="${GITHUB_REF_NAME#v}"
          P=$(node -p "require('./package.json').version")
          echo "tag=$V package.json=$P"
          [ "$V" = "$P" ] || { echo "tag v$V 与 package.json $P 不一致"; exit 1; }

      - name: 注册表查重——该版本未被发布过
        run: |
          V="${GITHUB_REF_NAME#v}"
          if npm view "methodblocks@$V" version >/dev/null 2>&1; then
            echo "methodblocks@$V 已存在于 npm，拒绝重复发布"; exit 1
          fi
          echo "methodblocks@$V 未发布，可以发布"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: 安装与构建
        run: npm ci && npm run build

      - name: 测试
        run: npm test

      - name: 发布（OIDC＋provenance）
        run: npm publish --provenance --access public

      - name: GitHub Release
        run: gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes --title "methodblocks ${GITHUB_REF_NAME#v}"
        env:
          GH_TOKEN: ${{ github.token }}
